<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signaler un problème informatique — Collège Anne Frank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="pub">
  <div class="pubhead"><div class="logo">TICE</div><div><h1>Signaler un problème informatique</h1><div class="sub">Collège Anne Frank · Lambersart. Ta demande arrive directement chez le référent TICE.</div></div></div>
  <div id="done"></div>
  <div class="card" style="margin-bottom:16px">
    <form id="f">
      <div class="fg">
        <div class="f"><label>Ton nom</label><input name="nom" maxlength="80" placeholder="pour qu'on puisse te recontacter"></div>
        <div class="f"><label>Salle *</label><input name="salle" required maxlength="40" placeholder="ex. 101, CDI, VO"></div>
        <div class="f"><label>Poste (si connu)</label><input name="poste" maxlength="60" class="mono" placeholder="nom sur l'étiquette du PC"></div>
        <div class="f"><label>Type de problème *</label><select name="categorie" required id="cat"></select></div>
        <div class="f"><label>Urgence</label><select name="urgence" id="urg"></select></div>
        <div class="f full"><label>Description *</label><textarea name="description" required minlength="5" maxlength="2000" placeholder="Que se passe-t-il ? Depuis quand ? Y a-t-il un message d'erreur ?"></textarea></div>
        <div class="hp" aria-hidden="true"><label>Site web</label><input name="website" tabindex="-1" autocomplete="off"></div>
      </div>
      <div class="mfoot"><span class="tiny">Tu recevras un code pour suivre ta demande.</span><button class="btn primary" type="submit">Envoyer le signalement</button></div>
    </form>
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3>Suivre un signalement</h3>
    <form id="track" class="row"><input name="code" placeholder="Code de suivi" class="mono" style="flex:1;border:1px solid var(--line);background:var(--bg);padding:8px 10px;border-radius:8px" required><button class="btn" type="submit">Voir</button></form>
    <div id="trackres" style="margin-top:10px"></div>
  </div>
  <div class="card" id="minebox" style="display:none"><h3>Mes signalements (sur cet appareil)</h3><div id="mine" class="list"></div></div>
  <p class="tiny" style="text-align:center;margin-top:24px">Référent TICE : Lucas GEST · <a href="/admin" style="color:inherit">Espace TICE</a></p>
</div>
<div id="toast"></div>
<script type="module" src="/js/public.js"></script>
</body>
</html>
